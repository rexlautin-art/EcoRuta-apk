name: Compilar EcoRuta APK y Panel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Compilar Panel de PC
        run: |
          cd panel
          npm install
          npm run build

      - name: Guardar Archivos Generados
        uses: actions/upload-artifact@v4
        with:
          name: EcoRuta-Archivos-Nuevos
          path: |
            panel/dist/
            celular/
