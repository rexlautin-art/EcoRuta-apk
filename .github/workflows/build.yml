name: Compilar EcoRuta APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a Gradle y Compilar APK
        working-directory: ./celular
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: EcoRuta-APK-Instalador
          path: celular/app/build/outputs/apk/debug/*.apk
