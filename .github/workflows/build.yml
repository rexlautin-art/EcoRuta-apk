name: Compilar EcoRuta

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Panel
        shell: pwsh
        run: |
          if (Test-Path "panel/package.json") {
            cd panel
            npm install --legacy-peer-deps
            npm run build --if-present
          } else {
            Write-Host "No se encontro package.json en panel, empaquetando archivos directos."
          }

      - name: Empaquetar Todo EcoRuta
        uses: actions/upload-artifact@v4
        with:
          name: EcoRuta-Completo
          path: |
            panel/
            celular/
          if-no-files-found: warn
